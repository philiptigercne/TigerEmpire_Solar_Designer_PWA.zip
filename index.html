<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tiger Empire — Solar System Design, Sizing & ROI</title>

<link rel="icon" href="favicon.png" sizes="64x64" type="image/png">

<style>
:root{
  --ink:#0B1220;
  --ink-2:#101B33;
  --navy:#15305E;
  --navy-2:#1E3F7D;
  --blue:#2158A6;
  --blue-light:#E8EFFA;
  --blue-mid:#C6D8F0;
  --paper:#F5F6F9;
  --paper-2:#EAEDF3;
  --line:#D7DCE6;
  --gold:#D9A62A;
  --gold-light:#F3D98B;
  --gold-dark:#A97A16;
  --rust:#B23A2E;
  --white:#FFFFFF;
  --slate:#5B6472;
  --mono: "SFMono-Regular","Consolas","Liberation Mono",Menlo,monospace;
  --sans: -apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  --serif: Georgia,Cambria,"Times New Roman",Times,serif;
  --radius: 3px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--sans);
  background:var(--paper);
  color:var(--ink);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--gold-light);color:var(--ink);}
a{color:var(--blue);}
button{font-family:inherit;}
h1,h2,h3{font-family:var(--serif);font-weight:700;margin:0 0 .4em;color:var(--ink);letter-spacing:-.005em;}
h4{font-family:var(--sans);font-weight:700;margin:0 0 .4em;color:var(--slate);}
h1{font-size:23px;} h2{font-size:19px;} h3{font-size:15.5px;} h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;}
table{border-collapse:collapse;width:100%;font-size:12.5px;}
input,select,textarea{
  font-family:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);
  border-radius:var(--radius);background:var(--white);color:var(--ink);width:100%;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:0;border-color:var(--gold-dark);}
label{display:block;font-size:11.5px;color:var(--slate);margin-bottom:3px;text-transform:none;}
.field{margin-bottom:10px;}
.grid{display:grid;gap:12px;}
.g2{grid-template-columns:1fr 1fr;} .g3{grid-template-columns:repeat(3,1fr);}
.g4{grid-template-columns:repeat(4,1fr);} .g5{grid-template-columns:repeat(5,1fr);}
@media(max-width:900px){.g2,.g3,.g4,.g5{grid-template-columns:1fr 1fr;}}

/* ===== App shell ===== */
#app{display:flex;min-height:100vh;}
#sidebar{
  width:224px;flex:0 0 224px;background:var(--ink);color:var(--paper);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
  border-right:3px solid var(--gold);
}
#brand{padding:20px 16px 16px;border-bottom:1px solid rgba(217,166,42,.25);}
#brand .mark{font-size:10.5px;letter-spacing:.16em;color:var(--gold);text-transform:uppercase;font-weight:700;}
#brand h1{font-family:var(--serif);color:var(--paper);font-size:19px;margin:3px 0 0;}
#brand .tag{font-size:11px;color:#8CA2C9;margin-top:3px;}
nav.navlist{padding:10px 8px;flex:1;}
nav.navlist button{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:none;
  color:#C6D2E6;padding:9px 10px;border-radius:var(--radius);cursor:pointer;font-size:13px;margin-bottom:2px;
}
nav.navlist button .ic{width:20px;text-align:center;font-family:var(--mono);color:var(--gold);font-size:10.5px;font-weight:700;}
nav.navlist button:hover{background:rgba(255,255,255,.06);}
nav.navlist button.active{background:var(--navy-2);color:var(--white);font-weight:600;box-shadow:inset 3px 0 0 var(--gold);}
#sidebar-foot{padding:12px 16px;border-top:1px solid rgba(217,166,42,.2);font-size:11px;color:#6E82A8;}

#main{flex:1;min-width:0;}
#topbar{
  position:sticky;top:0;z-index:5;background:var(--white);border-bottom:1px solid var(--line);
  padding:11px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px;
  box-shadow:0 1px 0 var(--line);
}
#topbar .proj{font-size:13px;color:var(--slate);}
#topbar .proj b{color:var(--ink);}
#topbar .status{font-size:11.5px;color:var(--blue);font-family:var(--mono);}
#topbar .actions{display:flex;gap:8px;align-items:center;}

#content{padding:22px 26px 60px;max-width:1280px;}
.section{display:none;}
.section.active{display:block;}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px;border-bottom:2px solid var(--ink);padding-bottom:11px;position:relative;}
.pagehead::after{content:"";position:absolute;left:0;bottom:-2px;width:64px;height:2px;background:var(--gold);}
.pagehead h2{margin:0;}
.pagehead .sub{font-size:12px;color:var(--slate);margin-top:3px;font-family:var(--sans);}

/* ===== Buttons ===== */
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--radius);
  border:1px solid var(--ink);background:var(--white);color:var(--ink);cursor:pointer;font-size:12.5px;font-weight:600;
}
.btn:hover{background:var(--paper-2);}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--white);}
.btn.primary:hover{background:var(--blue);border-color:var(--blue);}
.btn.gold{background:var(--gold);border-color:var(--gold-dark);color:var(--ink);}
.btn.gold:hover{background:var(--gold-dark);color:var(--white);}
.btn.danger{background:var(--white);border-color:var(--rust);color:var(--rust);}
.btn.danger:hover{background:var(--rust);color:var(--white);}
.btn.sm{padding:4px 10px;font-size:11.5px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}

/* ===== Cards ===== */
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:17px;border-top:3px solid var(--navy);}
.cardhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.stat-row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:18px;}
@media(max-width:1100px){.stat-row{grid-template-columns:repeat(3,1fr);}}
.stat{background:var(--ink);color:var(--paper);border-radius:var(--radius);padding:13px 14px;position:relative;overflow:hidden;border-bottom:2px solid var(--gold);}
.stat.alt{background:var(--white);color:var(--ink);border:1px solid var(--line);border-bottom:2px solid var(--gold);}
.stat .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:#8CA2C9;}
.stat.alt .k{color:var(--slate);}
.stat .v{font-family:var(--mono);font-size:20px;font-weight:700;margin-top:4px;}
.stat .u{font-size:11px;color:#8CA2C9;margin-left:2px;}
.stat.alt .u{color:var(--slate);}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);}
table.data th{
  background:var(--ink);color:var(--paper);text-align:left;padding:8px 9px;font-size:11px;
  text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0;border-bottom:2px solid var(--gold);
}
table.data td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:middle;}
table.data tr:nth-child(even) td{background:var(--paper-2);}
table.data tr:hover td{background:var(--blue-light);}
table.data td.num{font-family:var(--mono);text-align:right;}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:10.5px;font-weight:600;}
.tag.crit{background:#F3D6D0;color:var(--rust);}
.tag.ess{background:var(--gold-light);color:var(--gold-dark);}
.tag.non{background:var(--blue-mid);color:var(--navy);}
.tag.src{background:var(--paper-2);color:var(--slate);border:1px solid var(--line);}
.tag.override{background:#F3D6D0;color:var(--rust);}

.warn-list{display:flex;flex-direction:column;gap:6px;}
.warn{padding:8px 11px;border-left:3px solid var(--rust);background:#FAEBE8;font-size:12.5px;border-radius:0 var(--radius) var(--radius) 0;}
.warn.info{border-left-color:var(--blue);background:var(--blue-light);}
.warn b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--rust);}
.warn.info b{color:var(--navy);}

.formula{
  font-family:var(--mono);font-size:12.5px;background:var(--ink);color:#EAF0DD;padding:9px 12px;
  border-radius:var(--radius);margin:6px 0;overflow-x:auto;white-space:pre;border-left:3px solid var(--gold);
}
.hint{font-size:11.5px;color:var(--slate);margin-top:4px;}
.divider{height:1px;background:var(--line);margin:18px 0;}
.chip-row{display:flex;gap:6px;flex-wrap:wrap;}
.chip{padding:4px 11px;border:1px solid var(--line);border-radius:12px;font-size:11.5px;cursor:pointer;background:var(--white);}
.chip.active{background:var(--ink);color:var(--white);border-color:var(--ink);}
.search-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center;}
.search-bar input[type=text]{flex:1;min-width:200px;}
.search-bar select{width:auto;min-width:140px;}
.small-note{font-size:11px;color:var(--slate);}
.badge-count{background:var(--gold);color:var(--ink);border-radius:10px;padding:0 7px;font-size:10.5px;font-weight:700;margin-left:auto;}
.flexbetween{display:flex;justify-content:space-between;align-items:center;}
.right{text-align:right;}
.mono{font-family:var(--mono);}
.muted{color:var(--slate);}
.two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;}
@media(max-width:1000px){.two-col{grid-template-columns:1fr;}}
canvas.chart{width:100%;display:block;}
.modal-overlay{position:fixed;inset:0;background:rgba(11,18,32,.6);display:flex;align-items:center;justify-content:center;z-index:50;}
.modal{background:var(--white);border-radius:var(--radius);width:560px;max-width:92vw;max-height:88vh;overflow-y:auto;padding:20px 22px;border-top:4px solid var(--gold);}
.modal h3{margin-bottom:14px;}
.close-x{float:right;cursor:pointer;font-size:18px;color:var(--slate);}
.toast{
  position:fixed;bottom:18px;right:18px;background:var(--ink);color:var(--paper);padding:10px 16px;
  border-radius:var(--radius);font-size:12.5px;z-index:80;box-shadow:0 4px 14px rgba(0,0,0,.3);border-left:3px solid var(--gold);
}
.price-list{display:flex;flex-direction:column;gap:4px;}
.price-opt{display:flex;justify-content:space-between;gap:8px;padding:5px 8px;border:1px solid var(--line);border-radius:var(--radius);cursor:pointer;font-size:12px;}
.price-opt.selected{border-color:var(--blue);background:var(--blue-light);}
.price-opt .amt{font-family:var(--mono);font-weight:700;}
.price-opt.computed .amt{color:var(--gold-dark);}
select[multiple]{height:auto;}
.empty-state{padding:40px 20px;text-align:center;color:var(--slate);border:1px dashed var(--line);border-radius:var(--radius);}
.icon-btn{background:none;border:none;cursor:pointer;color:var(--slate);font-size:13px;padding:2px 5px;}
.icon-btn:hover{color:var(--rust);}
.qty-input{width:64px;text-align:right;font-family:var(--mono);padding:3px 6px;}
.progress{height:5px;background:var(--paper-2);border-radius:3px;overflow:hidden;}
.progress > div{height:100%;background:var(--blue);}
@media print{
  #sidebar,#topbar,.no-print{display:none !important;}
  #content{padding:0;max-width:none;}
  .section{display:none !important;}
  .section.print-active{display:block !important;}
  body{background:#fff;}
  * {-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important;color-adjust:exact !important;}
  .card{border:1px solid #ccc;break-inside:avoid;}
}
.footer-disclaimer{font-size:10.5px;color:var(--slate);border-top:1px solid var(--line);padding-top:10px;margin-top:26px;line-height:1.6;}
#printableReport h3{border-left:4px solid var(--gold);padding-left:9px;margin-top:22px;color:var(--navy);}
#printableReport table.data{margin-bottom:4px;}
#printableReport .small-note{margin-top:2px;}
#reportPreview{border-top:3px solid var(--gold);}
@media print{
  #printableReport{padding:20px 26px;}
  #printableReport h3{page-break-after:avoid;}
  #printableReport table.data{page-break-inside:avoid;}
}

</style>

/* ---------- tiny utils ---------- */
function uid(prefix){ return (prefix||'id')+'_'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
function nowISO(){ return new Date().toISOString(); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function num(v,d){ v = parseFloat(v); return isFinite(v)? v : (d===undefined?0:d); }
function fmtMoney(n, cur){
  cur = cur || 'NGN';
  if(n===null||n===undefined||isNaN(n)) return 'PRICE NOT AVAILABLE';
  const sym = CUR_SYMBOL[cur] || cur+' ';
  return sym + Number(n).toLocaleString('en-NG',{maximumFractionDigits:2});
}
function fmtNum(n, dp){ if(n===null||n===undefined||isNaN(n)) return '—'; dp = dp===undefined?2:dp; return Number(n).toLocaleString('en-NG',{maximumFractionDigits:dp, minimumFractionDigits:0}); }
function esc(s){ return (s===undefined||s===null)?'':String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstChild; }
function $(sel,ctx){ return (ctx||document).querySelector(sel); }
function $all(sel,ctx){ return Array.from((ctx||document).querySelectorAll(sel)); }
function toast(msg){
  const t = el(`<div class="toast">${esc(msg)}</div>`);
  document.body.appendChild(t);
  setTimeout(()=>{ t.style.transition='opacity .4s'; t.style.opacity='0'; setTimeout(()=>t.remove(),400); }, 2200);
}
function debounce(fn, ms){ let h; return (...a)=>{ clearTimeout(h); h=setTimeout(()=>fn(...a), ms); }; }

/* ---------- persistence ---------- */
function loadJSON(key, fallback){
  try{ const raw = localStorage.getItem(key); return raw? JSON.parse(raw) : fallback; }
  catch(e){ console.error('load fail', key, e); return fallback; }
}
function saveJSON(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); return true; }
  catch(e){ console.error('save fail', key, e); toast('Save failed — storage may be full'); return false; }
}

function migrateProject(p){
  if(!p.costItems){
    const c = p.cost || {};
    const map = [
      ['mounting','Mounting Structure','Mounting Structure & Racking'],
      ['protection','Protective Devices','Surge Protection, Breakers & Isolators'],
      ['cables','Cables','DC/AC Cabling'],
      ['db','Distribution Board','Distribution Board'],
      ['switchgear','Switchgear','Switchgear'],
      ['transformer','Transformer','Transformer'],
      ['ats','ATS / Change Over','Automatic Transfer Switch'],
      ['rmu','RMU','Ring Main Unit'],
      ['monitoring','Monitoring System','Monitoring System'],
      ['other','Other','Miscellaneous Equipment'],
      ['installation','Installation','Installation Labour'],
      ['transport','Transportation','Transportation & Logistics'],
      ['civil','Civil Works','Civil Works'],
      ['labour','Labour','Site Labour'],
      ['engineering','Engineering / Design','Engineering & Design'],
      ['permits','Permits','Permits & Approvals'],
      ['financing','Financing','Financing Cost'],
    ];
    p.costItems = map.map(([k,cat,desc])=>({id:uid('cost'), category:cat, description:desc, qty:1, unit:'lot', unitPrice: num(c[k],0)}))
      .filter(it=>it.unitPrice>0 || ['Mounting Structure','Protective Devices','Cables','Distribution Board','Installation','Engineering / Design','Transportation','Civil Works'].includes(it.category));
    if(!p.financeSettings) p.financeSettings = {contingencyPct: num(c.contingencyPct,5), taxPct: num(c.taxPct,0)};
  }
  if(!p.financeSettings) p.financeSettings = {contingencyPct:5, taxPct:0};
  if(!p.boqExtra) p.boqExtra = [];
  if(p.cable && p.cable.acLength===undefined){
    p.cable.acLength = p.cable.length!=null ? p.cable.length : 20;
    if(p.cable.pvLength===undefined) p.cable.pvLength = 15;
    if(p.cable.dcLength===undefined) p.cable.dcLength = 3;
    if(p.cable.combinerCapacity===undefined) p.cable.combinerCapacity = 4;
    delete p.cable.length;
  }
  if(p.cost) delete p.cost;
}

function getProject(id){ return PROJECTS[id]; }
function getCurrent(){ return CURRENT_ID && PROJECTS[CURRENT_ID] ? PROJECTS[CURRENT_ID] : null; }
function setCurrent(id){ CURRENT_ID = id; saveJSON(LS_CURRENT, id); }
function touchProject(p){ p.updatedAt = nowISO(); }
function persistCurrent(){

  PROJECTS[p.id] = p;
  saveProjects();
  const s = $('#saveStatus'); if(s){ s.textContent = 'Saved '+new Date().toLocaleTimeString(); }
}
const persistDebounced = debounce(persistCurrent, 500);


/* =========================================================
   CALCULATION ENGINE
   ========================================================= */

function loadRunningPower(l){ return num(l.qty,1) * num(l.power,0); } // W
function loadPeakPower(l){ return loadRunningPower(l) * num(l.surge,1); } // W
function loadDailyEnergy(l){ return loadRunningPower(l) * num(l.hours,0) / 1000; } // kWh/day
function loadMonthlyEnergy(l){ return loadDailyEnergy(l) * (num(l.daysMonth,30)); }
function loadAnnualEnergy(l){ return loadDailyEnergy(l) * 365 * (num(l.daysWeek,7)/7); }

function computeLoadSummary(p){
  const loads = p.loads;
  let totalRunning=0, totalPeak=0, dailyEnergy=0, criticalDaily=0, essentialDaily=0, nonDaily=0;
  loads.forEach(l=>{
    const run = loadRunningPower(l), peak = loadPeakPower(l), day = loadDailyEnergy(l);
    totalRunning += run; totalPeak += peak; dailyEnergy += day;
    if(l.priority==='Critical') criticalDaily += day;
    else if(l.priority==='Essential') essentialDaily += day;
    else nonDaily += day;
  });
  return { totalRunning, totalPeak, dailyEnergy, monthlyEnergy: dailyEnergy*30, annualEnergy: dailyEnergy*365,
    criticalDaily, essentialDaily, nonDaily, backupDaily: criticalDaily+essentialDaily };
}

/* Build 24-hour hourly profile in kW from loads' start/end time, or use override */
function computeHourly(p){
  if(p.hourlyOverride && p.hourlyOverride.length===24) return p.hourlyOverride.slice();
  const hrs = new Array(24).fill(0);
  p.loads.forEach(l=>{
    const run = loadRunningPower(l)/1000; // kW
    let start = parseTimeHour(l.startTime), end = parseTimeHour(l.endTime);
    if(start===null || end===null || num(l.hours,0)<=0){
      // spread evenly across opHours window if no explicit times
      const h = Math.min(24, Math.round(num(l.hours,0)));
      for(let i=0;i<h;i++) hrs[i] += run;
      return;
    }
    if(end===start){ for(let i=0;i<24;i++) hrs[i]+=run; return; }
    let i = Math.floor(start);
    while(true){
      const hourIdx = ((i%24)+24)%24;
      hrs[hourIdx]+=run;
      i++;
      if(((i%24)+24)%24 === Math.floor(end)%24 && i> Math.floor(start)) break;
      if(i - start >= 24) break;
    }
  });
  return hrs;
}
function parseTimeHour(t){
  if(!t) return null;
  const m = /^(\d{1,2}):(\d{2})$/.exec(t);
  if(!m) return null;
  return parseInt(m[1],10) + parseInt(m[2],10)/60;
}
function computeHourlyStats(hrs){
  const max = Math.max(...hrs), min = Math.min(...hrs);
  const sum = hrs.reduce((a,b)=>a+b,0);
  const avg = sum/24;
  const loadFactor = max>0? (avg/max*100) : 0;
  return { max, min, avg, sum, loadFactor };
}

/* Solar losses & PV sizing */
function computeSystemEfficiency(p){
  const s = p.solar;
  if(s.lossMode==='manual') return Math.max(1, 100 - num(s.manualLoss,15))/100;
  const L = s.losses;
  const totalLossPct = num(L.temp)+num(L.dust)+num(L.wiring)+num(L.inverter)+num(L.battery)+num(L.mismatch)+num(L.other);
  return Math.max(0.1, (100-totalLossPct)/100);
}
function computePV(p, loadSummary){
  const eff = computeSystemEfficiency(p);
  const psh = num(p.solar.psh, 5);
  const solarFraction = num(p.solar.solarFraction,100)/100;
  const dailyDemand = loadSummary.dailyEnergy * solarFraction;
  const margin = 1 + num(p.solar.designMargin,15)/100;
  const requiredKwp = psh>0 ? (dailyDemand / (psh*eff)) : 0;
  const recommendedKwp = requiredKwp * margin;
  return {
    efficiency: eff, psh, dailyDemand,
    requiredKwp, recommendedKwp,
    expectedDailyEnergy: recommendedKwp*psh*eff,
    expectedMonthlyEnergy: recommendedKwp*psh*eff*30,
    expectedAnnualEnergy: recommendedKwp*psh*eff*365,
  };
}

function selectedPrice(equip, priceLabel, manualPrice){
  if(manualPrice!==undefined && manualPrice!==null && manualPrice!=='') return {amount:num(manualPrice), label:'Manual Price Override', override:true};
  if(!equip) return {amount:null,label:'—'};
  let pr = equip.prices.find(x=>x.label===priceLabel);
  if(!pr) pr = equip.prices[0];
  return pr ? {amount:pr.amount, label:pr.label, source:pr.source} : {amount:null,label:'—'};
}

function panelWatt(equip){
  if(!equip) return 0;
  const text = (equip.name+' '+(equip.model||'')).toLowerCase();
  const m = /(\d{2,4})\s*w/.exec(text);
  return m? parseInt(m[1],10) : 0;
}
function battKwh(equip){
  if(!equip) return 0;
  const text = (equip.name+' '+(equip.model||'')).toLowerCase();
  let m = /([\d.]+)\s*kwh/.exec(text);
  if(m) return parseFloat(m[1]);
  m = /([\d.]+)\s*ah/.exec(text);
  const v = battVoltage(equip);
  if(m && v) return parseFloat(m[1])*v/1000;
  return 0;
}
function battVoltage(equip){
  if(!equip) return 0;
  const text = (equip.name+' '+(equip.model||'')).toLowerCase();
  const m = /(\d{2,3})\s*v\b/.exec(text);
  return m? parseInt(m[1],10) : 0;
}
function inverterKva(equip){
  if(!equip) return 0;
  const text = (equip.name+' '+(equip.model||'')).toLowerCase();
  let m = /([\d.]+)\s*kva/.exec(text);
  if(m) return parseFloat(m[1]);
  m = /([\d.]+)\s*kw/.exec(text);
  if(m) return parseFloat(m[1]);
  return 0;
}

function computePanelSelection(p, pv){
  const eq = getEquipById(p.selectedPanelId);
  const wp = panelWatt(eq);
  let qty = null, price=null, totalCost=null, installedKwp=null;
  if(eq && wp>0){
    qty = p.panelQtyOverride!=null? num(p.panelQtyOverride) : Math.ceil((pv.recommendedKwp*1000)/wp);
    installedKwp = qty*wp/1000;
    const sel = getSelectionPrice(p,'Solar Panel',eq);
    price = sel.amount;
    totalCost = price!=null? price*qty : null;
  }
  return {equip:eq, wattPer:wp, qty, installedKwp, unitPrice:price, totalCost};
}

function getSelectionPrice(p, category, equip){
  const s = p.equipmentSelections[category];
  if(!equip) return {amount:null,label:'—'};
  const label = s? s.priceLabel : (equip.prices[0] && equip.prices[0].label);
  const manual = s? s.manualPrice : null;
  return selectedPrice(equip, label, manual);
}

function computeStringDesign(p, panelSel){
  const eq = panelSel.equip;
  if(!eq || !panelSel.wattPer) return null;
  const sd = p.stringDesign;
  // approximate Voc/Vmp from wattage class (typical half-cut mono panel electrical characteristics)
  const wp = panelSel.wattPer;
  const vocEst = wp<=250? 37 : wp<=400? 41 : wp<=550? 46 : wp<=650? 50 : 54;
  const vmpEst = vocEst*0.83;
  const iscEst = +(wp/vocEst*1.06).toFixed(2);
  const tempCoeff = -0.0032; // per °C typical for Voc
  const dT = sd.minTemp-25;
  const vocCold = vocEst*(1+(-tempCoeff)*(-dT)); // Voc rises in cold
  const panelsPerStringMax = Math.floor(sd.maxDcV / vocCold);
  const panelsPerStringMpptMin = Math.ceil(sd.mpptMin / vmpEst);
  const panelsPerStringMpptMax = Math.floor(sd.mpptMax / vmpEst);
  let panelsPerString = sd.panelsPerStringOverride!=null? num(sd.panelsPerStringOverride) :
    Math.max(1, Math.min(panelsPerStringMax, panelsPerStringMpptMax));
  const totalPanels = panelSel.qty || 0;
  let strings = sd.stringsOverride!=null? num(sd.stringsOverride) : Math.max(1, Math.ceil(totalPanels/Math.max(1,panelsPerString)));
  const stringVoc = panelsPerString*vocCold;
  const stringVmp = panelsPerString*vmpEst;
  const arrayCurrent = strings*iscEst;
  const warnings=[];
  if(stringVoc > sd.maxDcV) warnings.push(`String Voc (${fmtNum(stringVoc,1)}V) exceeds inverter maximum DC voltage (${sd.maxDcV}V).`);
  if(strings > sd.maxMppt) warnings.push(`Number of strings (${strings}) exceeds available MPPT inputs (${sd.maxMppt}).`);
  if(arrayCurrent/Math.max(1,strings) > sd.maxDcA) warnings.push(`String current (${fmtNum(iscEst,1)}A) may exceed maximum inverter input current per MPPT (${sd.maxDcA}A).`);
  return {vocEst,vmpEst,iscEst,vocCold,panelsPerString,strings,totalPanels,stringVoc,stringVmp,arrayCurrent, totalDcKwp: totalPanels*wp/1000, warnings};
}

function computeInverterSizing(p, loadSummary){
  const cfg = p.inverterCfg;
  const surgeReq = loadSummary.totalPeak/1000;
  const contReq = loadSummary.totalRunning/1000 / num(p.elec.pf,0.9);
  const loadingPct = num(cfg.loadingPct,80)/100;
  const requiredKva = Math.max(contReq, surgeReq*0.6); // heuristic: surge handled by short-term overload
  const recommendedKva = requiredKva/Math.max(0.5,loadingPct);
  const eq = getEquipById(p.selectedInverterId);
  const unitKva = inverterKva(eq);
  let qty=null, totalKva=null, loadingActual=null, price=null, totalCost=null;
  if(eq && unitKva>0){
    qty = p.inverterQtyOverride!=null? num(p.inverterQtyOverride) : Math.max(1, Math.ceil(recommendedKva/unitKva));
    totalKva = qty*unitKva;
    loadingActual = totalKva>0? (contReq/totalKva*100):0;
    const sel = getSelectionPrice(p,'Inverter',eq);
    price = sel.amount; totalCost = price!=null? price*qty : null;
  }
  const warnings=[];
  if(totalKva!=null && totalKva < contReq) warnings.push(`Total inverter capacity (${fmtNum(totalKva,2)} kVA) is below the continuous load requirement (${fmtNum(contReq,2)} kVA).`);
  if(totalKva!=null && totalKva*1.3 < surgeReq) warnings.push(`Inverter surge headroom may be insufficient for peak/startup load (${fmtNum(surgeReq,2)} kVA).`);
  return {contReq, surgeReq, requiredKva, recommendedKva, equip:eq, unitKva, qty, totalKva, loadingActual, unitPrice:price, totalCost, warnings};
}

function computeBattery(p, loadSummary){
  const b = p.battery;
  const backupLoad = loadSummary.backupDaily>0 ? (loadSummary.criticalDaily+loadSummary.essentialDaily)/Math.max(1, num(p.elec.opHours,24)) * num(p.elec.opHours,24) : 0;
  // backup energy required = (critical+essential average power) * backup hours -- approximate using daily backup energy scaled to backup window
  const avgBackupPowerKw = (loadSummary.criticalDaily+loadSummary.essentialDaily) / Math.max(1,num(p.elec.opHours,24));
  const backupHours = num(b.backupHours, p.elec.backupHours || 6);
  const requiredUsableKwh = avgBackupPowerKw * backupHours;
  const dod = num(b.dod,90)/100;
  const rte = num(b.roundTrip,95)/100;
  const tempDerate = 1 - num(b.tempDerate,0)/100;
  const margin = 1.1;
  const requiredNominalKwh = dod>0 ? (requiredUsableKwh/(dod*rte*tempDerate))*margin : 0;

  const eq = getEquipById(p.selectedBatteryId);
  const unitKwh = battKwh(eq);
  let qty=null, installedKwh=null, usableKwh=null, price=null, totalCost=null, estBackupHrs=null;
  if(eq && unitKwh>0){
    qty = p.batteryQtyOverride!=null? num(p.batteryQtyOverride) : Math.ceil(requiredNominalKwh/unitKwh);
    installedKwh = qty*unitKwh;
    usableKwh = installedKwh*dod;
    estBackupHrs = avgBackupPowerKw>0 ? (usableKwh*rte)/avgBackupPowerKw : 0;
    const sel = getSelectionPrice(p,'Lithium Battery',eq) && getEquipById(p.selectedBatteryId).category==='Lithium Battery'
      ? getSelectionPrice(p,'Lithium Battery',eq) : getSelectionPrice(p, eq.category, eq);
    price = sel.amount; totalCost = price!=null? price*qty : null;
  }
  const warnings=[];
  if(installedKwh!=null && estBackupHrs!=null && estBackupHrs < backupHours*0.9) warnings.push(`Battery bank may deliver only ~${fmtNum(estBackupHrs,1)}h backup vs the required ${backupHours}h.`);
  return {avgBackupPowerKw, backupHours, requiredUsableKwh, requiredNominalKwh, equip:eq, unitKwh, qty, installedKwh, usableKwh, estBackupHrs, unitPrice:price, totalCost, warnings};
}

/* Cable sizing (simplified engineering approximation, copper, per IEC-style volt-drop check) */
const CABLE_SIZES_MM2 = [1.5,2.5,4,6,10,16,25,35,50,70,95,120];
const CABLE_AMPACITY = {1.5:19.5,2.5:27,4:36,6:46,10:63,16:85,25:112,35:138,50:168,70:213,95:258,120:299};
function resistivityOhmPerKm(material){ return material==='Aluminium' ? 0.0282 : 0.0175; } // ohm.mm2/m *1000
function computeCableSizing(p, current, voltage, lengthOverride){
  const c = p.cable;
  const L = num(lengthOverride!=null?lengthOverride:c.acLength, 20);
  const rho = resistivityOhmPerKm(c.material);
  const conductors = num(c.conductors,2);
  const maxDropPct = num(c.maxVdrop,3);
  const maxDropV = voltage*maxDropPct/100;
  let chosen=null;
  for(const s of CABLE_SIZES_MM2){
    const R = rho*L/s; // ohm one-way (rho in ohm.mm2/m, L in m)
    const vdrop = conductors*current*R;
    if(CABLE_AMPACITY[s]>=current*1.25 && vdrop<=maxDropV){ chosen = {size:s, vdrop, vdropPct:vdrop/voltage*100, ampacity:CABLE_AMPACITY[s], current, voltage, length:L}; break; }
  }
  if(!chosen){
    const s = CABLE_SIZES_MM2[CABLE_SIZES_MM2.length-1];
    const R = rho*L/s; const vdrop = conductors*current*R;
    chosen = {size:s, vdrop, vdropPct:vdrop/voltage*100, ampacity:CABLE_AMPACITY[s], current, voltage, length:L, undersized:true};
  }
  return chosen;
}

/* PV string/array cable, and DC bus (battery/combiner) to inverter cable */
function computePvCableSizing(p, stringD){
  if(!stringD) return null;
  const current = stringD.iscEst; // per-string current, with 1.25 safety margin applied inside computeCableSizing via ampacity check
  const voltage = stringD.stringVmp || stringD.stringVoc || 1;
  return computeCableSizing(p, current, voltage, p.cable.pvLength);
}
function computeDcInverterCableSizing(p, invSel){
  const dcVoltage = num(p.battery.voltage, 48);
  const inverterEff = 0.95;
  const current = dcVoltage>0 ? (invSel.contReq*1000)/(dcVoltage*inverterEff) : 0;
  const cable = computeCableSizing(p, current, dcVoltage, p.cable.dcLength);
  return {...cable, dcVoltage};
}

/* DC busbars & PV combiner boxes */
function computeBusbarsAndCombiners(p, stringD, invSel, battSel, dcCable){
  const strings = stringD ? stringD.strings : 0;
  const maxMppt = p.stringDesign.maxMppt || 1;
  const stringsPerCombiner = num(p.cable.combinerCapacity, 4);
  const combinerBoxesNeeded = (strings > maxMppt && stringsPerCombiner>0) ? Math.ceil(strings/stringsPerCombiner) : 0;

  const battQty = battSel.qty || 0;
  const invQty = invSel.qty || 0;
  const dcBusbarNeeded = battQty > 1 || invQty > 1;
  const busbarRatingA = dcBusbarNeeded ? (dcCable.current||0) * Math.max(1,invQty) * 1.25 : 0;

  const warnings = [];
  if(combinerBoxesNeeded>0) warnings.push(`${strings} PV strings exceed the ${maxMppt} available MPPT input(s) — ${combinerBoxesNeeded} combiner box(es) needed to consolidate strings before the inverter.`);
  if(dcBusbarNeeded) warnings.push(`${battQty} batteries / ${invQty} inverters in parallel — a DC busbar rated at least ${fmtNum(busbarRatingA,0)}A is recommended for a clean, low-loss connection point.`);

  return { strings, maxMppt, stringsPerCombiner, combinerBoxesNeeded, battQty, invQty, dcBusbarNeeded, busbarRatingA, warnings };
}

/* Protective device sizing */
function computeProtection(designCurrent){
  const rated = designCurrent*1.25;
  const standard = [6,10,16,20,25,32,40,50,63,80,100,125,160,200,250,315,400];
  const device = standard.find(s=>s>=rated) || standard[standard.length-1];
  return {designCurrent, recommendedRating: device};
}

/* Generator */
function computeGenerator(p, loadSummary){
  const g = p.generator;
  if(!g.enabled) return null;
  const energy = num(g.capacity,0)*num(g.opHours,0)*(num(g.minLoading,30)/100+0.3);
  const fuelUsed = num(g.fuelConsumption,0)*num(g.opHours,0);
  const cost = fuelUsed*num(g.fuelPrice,0);
  return { energyContribution: energy, fuelUsed, operatingCost: cost, annualCost: cost*365 };
}

/* Grid / energy savings */
function computeGridSavings(p, loadSummary, pv){
  const tariff = num(p.tariff,0);
  const monthlyConsumption = loadSummary.monthlyEnergy;
  const currentMonthlyCost = monthlyConsumption*tariff + num(p.grid.fixedCharge,0);
  const currentAnnualCost = currentMonthlyCost*12;
  const solarDaily = Math.min(pv.expectedDailyEnergy, loadSummary.dailyEnergy);
  const gridRemainingDaily = Math.max(0, loadSummary.dailyEnergy - solarDaily);
  const annualSavings = solarDaily*365*tariff;
  return { tariff, monthlyConsumption, currentMonthlyCost, currentAnnualCost, solarDaily, gridRemainingDaily, annualSavings,
    solarMonthly: solarDaily*30, solarAnnual: solarDaily*365 };
}

/* Financial - project cost */
function computeFinancial(p, panelSel, invSel, battSel, gridS){
  const items = p.costItems || [];
  let equipAcc=0, installationSubtotal=0, engineeringSubtotal=0, otherCosts=0;
  items.forEach(it=>{
    const t = num(it.qty,0)*num(it.unitPrice,0);
    const g = getCostGroup(it.category);
    if(g==='Equipment') equipAcc+=t;
    else if(g==='Installation') installationSubtotal+=t;
    else if(g==='Engineering') engineeringSubtotal+=t;
    else otherCosts+=t;
  });
  const extraEquip = (p.boqExtra||[]).reduce((a,x)=>a+(num(x.unitPrice,0)*num(x.qty,0)),0);
  const panelCost = panelSel.totalCost || 0;
  const inverterCost = invSel.totalCost || 0;
  const batteryCost = battSel.totalCost || 0;
  const equipmentSubtotal = panelCost+inverterCost+batteryCost+equipAcc+extraEquip;
  const preContingency = equipmentSubtotal+installationSubtotal+engineeringSubtotal+otherCosts;
  const fs = p.financeSettings || {contingencyPct:0, taxPct:0};
  const contingency = preContingency*num(fs.contingencyPct,0)/100;
  const taxable = preContingency+contingency;
  const taxes = taxable*num(fs.taxPct,0)/100;
  const grandTotal = taxable+taxes;
  return { panelCost, inverterCost, batteryCost, equipAcc, extraEquip, equipmentSubtotal, installationSubtotal, engineeringSubtotal,
    otherCosts, contingency, taxes, grandTotal };
}

/* ROI / NPV / IRR */
function computeROI(p, financial, gridS, genS){
  const r = p.roi;
  const invest = financial.grandTotal;
  const annualMaint = invest*num(r.annualMaintenancePct,0)/100;
  const baseSavings = gridS.annualSavings + (genS? genS.annualCost:0);
  const netAnnual1 = baseSavings - annualMaint;
  const years = Math.max(1, Math.round(num(r.lifetime,20)));
  const escalation = num(r.tariffEscalation,0)/100;
  const degradation = num(r.degradation,0)/100;
  const discountRate = num(r.interestRate,0)/100;

  let cum = -invest;
  const table = [];
  let paybackYear = null, discPaybackYear=null, npv = -invest, cumDisc=-invest;
  for(let y=1;y<=years;y++){
    const savingsY = baseSavings*Math.pow(1+escalation,y-1)*Math.pow(1-degradation,y-1);
    let capex=0;
    if(r.batteryReplaceYear && y===Math.round(num(r.batteryReplaceYear)) ) capex += num(r.batteryReplaceCost,0);
    if(r.inverterReplaceYear && y===Math.round(num(r.inverterReplaceYear)) ) capex += num(r.inverterReplaceCost,0);
    const maint = invest*num(r.annualMaintenancePct,0)/100*Math.pow(1+num(r.inflation,0)/100,y-1);
    const netCF = savingsY - maint - capex;
    cum += netCF;
    const discCF = netCF/Math.pow(1+discountRate,y);
    npv += discCF; cumDisc += discCF;
    if(paybackYear===null && cum>=0) paybackYear = y - (cum-netCF>-netCF?0:0), paybackYear = (cum-netCF)<0 && cum>=0 ? (y-1 + Math.abs(cum-netCF)/netCF) : paybackYear;
    if(discPaybackYear===null && cumDisc>=0) discPaybackYear = y - 1 + Math.abs(cumDisc-discCF)/Math.max(discCF,0.0001);
    table.push({year:y, savings:savingsY, maintenance:maint, capex, netCF, cumCF:cum, discCF, cumDisc});
  }
  const residual = invest*num(r.residualPct,0)/100;
  npv += residual/Math.pow(1+discountRate,years);
  const lifetimeSavings = table.reduce((a,t)=>a+t.savings,0);
  const lifetimeOperatingCost = table.reduce((a,t)=>a+t.maintenance+t.capex,0);
  const lifetimeNetBenefit = lifetimeSavings-lifetimeOperatingCost-invest+residual;
  const roiPct = invest>0? (lifetimeNetBenefit/invest*100) : 0;
  const simplePayback = netAnnual1>0? invest/netAnnual1 : null;
  const irr = estimateIRR([-invest, ...table.map(t=>t.netCF)]);
  return { invest, annualMaint, baseSavings, netAnnual1, simplePayback, table, npv, irr,
    lifetimeSavings, lifetimeOperatingCost, lifetimeNetBenefit, roiPct, paybackYear, discPaybackYear, residual };
}
function estimateIRR(cashflows){
  let lo=-0.99, hi=5, mid;
  function npvAt(r){ return cashflows.reduce((a,cf,i)=>a+cf/Math.pow(1+r,i),0); }
  if(npvAt(lo)*npvAt(hi)>0) return null;
  for(let i=0;i<100;i++){
    mid=(lo+hi)/2;
    const v = npvAt(mid);
    if(Math.abs(v)<1) break;
    if(npvAt(lo)*v<0) hi=mid; else lo=mid;
  }
  return mid*100;
}

/* Carbon */
function computeCarbon(p, gridS){
  const ef = num(p.carbon.emissionFactor,0.45); // kg CO2 per kWh
  const annualKwh = gridS.solarAnnual;
  const annualCO2 = annualKwh*ef/1000; // tonnes
  const lifetimeCO2 = annualCO2*num(p.roi.lifetime,20);
  const trees = annualCO2*45; // ~45 trees per tonne CO2/yr rough
  return { annualCO2, lifetimeCO2, trees };
}

/* Master compute - runs full pipeline, returns results object + warnings */
function runCalculations(p){
  const loadSummary = computeLoadSummary(p);
  const hourly = computeHourly(p);
  const hourlyStats = computeHourlyStats(hourly);
  const pv = computePV(p, loadSummary);
  const panelSel = computePanelSelection(p, pv);
  const stringD = computeStringDesign(p, panelSel);
  const invSel = computeInverterSizing(p, loadSummary);
  const battSel = computeBattery(p, loadSummary);
  const genS = computeGenerator(p, loadSummary);
  const gridS = computeGridSavings(p, loadSummary, pv);
  const financial = computeFinancial(p, panelSel, invSel, battSel, gridS);
  const roi = computeROI(p, financial, gridS, genS);
  const carbon = computeCarbon(p, gridS);
  const cableDesign = computeCableSizing(p, invSel.contReq*1000/num(p.elec.voltage,230), num(p.elec.voltage,230), p.cable.acLength);
  const protection = computeProtection(invSel.contReq*1000/num(p.elec.voltage,230));
  const pvCable = computePvCableSizing(p, stringD);
  const dcCable = computeDcInverterCableSizing(p, invSel);
  const busbars = computeBusbarsAndCombiners(p, stringD, invSel, battSel, dcCable);

  const warnings = [];
  stringD && stringD.warnings.forEach(w=>warnings.push({type:'warn',msg:w}));
  invSel.warnings.forEach(w=>warnings.push({type:'warn',msg:w}));
  battSel.warnings.forEach(w=>warnings.push({type:'warn',msg:w}));
  busbars.warnings.forEach(w=>warnings.push({type:'info',msg:w}));
  if(!panelSel.equip) warnings.push({type:'info',msg:'No solar panel selected yet — choose one in Solar & PV to complete sizing.'});
  if(!invSel.equip) warnings.push({type:'info',msg:'No inverter selected yet — choose one in Inverter to complete sizing.'});
  if(loadSummary.backupDaily>0 && !battSel.equip) warnings.push({type:'info',msg:'Critical/essential loads require backup but no battery is selected yet.'});
  if(cableDesign && cableDesign.undersized) warnings.push({type:'warn',msg:`Recommended inverter-to-AC cable (${cableDesign.size}mm\u00B2) may still exceed the allowable voltage-drop limit — consider parallel runs or shorter cable length.`});
  if(pvCable && pvCable.undersized) warnings.push({type:'warn',msg:`Recommended PV cable (${pvCable.size}mm\u00B2) may still exceed the allowable voltage-drop limit — consider a shorter run or splitting the array closer to the combiner.`});
  if(dcCable && dcCable.undersized) warnings.push({type:'warn',msg:`Recommended DC-to-inverter cable (${dcCable.size}mm\u00B2) may still exceed the allowable voltage-drop limit at this battery voltage — consider shortening the run or raising the DC bus voltage.`});
  if(panelSel.equip && panelSel.unitPrice==null) warnings.push({type:'warn',msg:'Selected solar panel has no price on file — mark PRICE NOT AVAILABLE and enter one manually.'});
  if(invSel.equip && invSel.unitPrice==null) warnings.push({type:'warn',msg:'Selected inverter has no price on file — mark PRICE NOT AVAILABLE and enter one manually.'});
  if(battSel.equip && battSel.unitPrice==null) warnings.push({type:'warn',msg:'Selected battery has no price on file — mark PRICE NOT AVAILABLE and enter one manually.'});
  if(p.solar.psh<=0) warnings.push({type:'warn',msg:'Peak Sun Hours must be greater than zero for PV sizing to work.'});
  if(pv.recommendedKwp>0 && stringD===null) warnings.push({type:'info',msg:'String design will populate once a panel with recognizable wattage is selected.'});

  return { loadSummary, hourly, hourlyStats, pv, panelSel, stringD, invSel, battSel, genS, gridS,
    financial, roi, carbon, cableDesign, protection, pvCable, dcCable, busbars, warnings };
}

/* =========================================================
   CANVAS CHART HELPERS (no external libs)
   ========================================================= */
function drawLineChart(canvas, series, opts){
  opts = opts||{};
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio||1;
  const w = canvas.clientWidth||600, h = opts.height||180;
  canvas.width = w*dpr; canvas.height = h*dpr; canvas.style.height=h+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  const padL=40,padR=14,padT=14,padB=24;
  const plotW = w-padL-padR, plotH = h-padT-padB;
  const allVals = series.flatMap(s=>s.data);
  const maxV = Math.max(1, ...allVals)*1.15, minV = Math.min(0, ...allVals);
  const n = series[0].data.length;
  ctx.strokeStyle = '#D8D0BA'; ctx.lineWidth=1;
  for(let i=0;i<=4;i++){
    const y = padT + plotH*i/4;
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(w-padR,y); ctx.stroke();
    ctx.fillStyle='#5B6B67'; ctx.font='10px monospace'; ctx.textAlign='right';
    ctx.fillText(fmtNum(maxV-(maxV-minV)*i/4,1), padL-6, y+3);
  }
  series.forEach(s=>{
    ctx.beginPath(); ctx.strokeStyle = s.color||'#1E6B5C'; ctx.lineWidth=2;
    s.data.forEach((v,i)=>{
      const x = padL + plotW*(i/(n-1||1));
      const y = padT + plotH*(1-(v-minV)/((maxV-minV)||1));
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    });
    ctx.stroke();
    if(s.fill){
      ctx.lineTo(padL+plotW, padT+plotH); ctx.lineTo(padL,padT+plotH); ctx.closePath();
      ctx.fillStyle = s.fillColor || (s.color+'22'); ctx.globalAlpha=0.18; ctx.fill(); ctx.globalAlpha=1;
    }
  });
  ctx.fillStyle='#5B6B67'; ctx.font='10px sans-serif'; ctx.textAlign='center';
  const labels = opts.labels || [];
  const step = Math.ceil(n/12);
  for(let i=0;i<n;i+=step){
    const x = padL + plotW*(i/(n-1||1));
    ctx.fillText(labels[i]!==undefined?labels[i]:i, x, h-6);
  }
}
function drawBarChart(canvas, data, opts){
  opts = opts||{};
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio||1;
  const w = canvas.clientWidth||600, h = opts.height||180;
  canvas.width = w*dpr; canvas.height=h*dpr; canvas.style.height=h+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  const padL=44,padR=14,padT=14,padB=26;
  const plotW=w-padL-padR, plotH=h-padT-padB;
  const maxV = Math.max(1,...data.map(d=>d.v))*1.15;
  const n = data.length; const bw = plotW/n*0.6;
  ctx.strokeStyle='#D8D0BA';
  for(let i=0;i<=4;i++){
    const y = padT+plotH*i/4;
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(w-padR,y); ctx.stroke();
    ctx.fillStyle='#5B6B67'; ctx.font='10px monospace'; ctx.textAlign='right';
    ctx.fillText(fmtNum(maxV-(maxV*i/4),0), padL-6, y+3);
  }
  data.forEach((d,i)=>{
    const x = padL + plotW*(i+0.5)/n - bw/2;
    const bh = plotH*(d.v/maxV);
    ctx.fillStyle = d.color||'#E0A62E';
    ctx.fillRect(x, padT+plotH-bh, bw, bh);
    ctx.fillStyle='#5B6B67'; ctx.font='10px sans-serif'; ctx.textAlign='center';
    ctx.fillText(d.label, x+bw/2, h-8);
  });
}

function downloadFile(filename, content, mime){
  const blob = new Blob([content], {type:mime||'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

function parseCSV(text){
  const lines = text.split(/\r?\n/).filter(l=>l.trim().length);
  if(!lines.length) return {headers:[], rows:[]};
  const headers = lines[0].split(',').map(h=>h.trim());
  const rows = lines.slice(1).map(line=>{
    const cells = line.split(',').map(c=>c.trim());
    const o = {}; headers.forEach((h,i)=>o[h]=cells[i]); return o;
  });
  return {headers, rows};
}

function handleLoadCsv(e, p){
  const f = e.target.files[0]; if(!f) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    const {headers, rows} = parseCSV(reader.result);
    const errors = []; const valid = [];
    const map = (row, keys)=>{ for(const k of keys){ if(row[k]!==undefined) return row[k]; } return undefined; };
    rows.forEach((row, i)=>{
      const name = map(row,['Load Name','Name','load_name']);
      const power = num(map(row,['Power','Rated Power','power']));
      const qty = num(map(row,['Quantity','Qty','quantity']),1);
      const hours = num(map(row,['Hours/Day','Hours','hours']));
      if(!name){ errors.push(`Row ${i+2}: missing Load Name.`); return; }
      if(power<=0){ errors.push(`Row ${i+2} (${name}): invalid Power value.`); return; }
      if(hours<0||hours>24){ errors.push(`Row ${i+2} (${name}): Hours/Day must be between 0 and 24.`); return; }
      valid.push({
        id: uid('load'), name, qty: qty||1, power, unit:'W', voltage:p.elec.voltage, phase:1,
        pf: num(map(row,['Power Factor','PF']),0.9)||0.9, hours,
        startTime: map(row,['Start Time','start_time'])||'18:00', endTime: map(row,['End Time','end_time'])||'22:00',
        daysWeek:7, daysMonth:30, surge: num(map(row,['Surge Factor','Surge']),1.5)||1.5,
        priority: map(row,['Priority'])||'Non-critical', backup:false, daytimeOnly:false, nighttimeOnly:false,
      });
    });
    p.loads = p.loads.concat(valid);
    persistCurrent(); recompute();
    const box = $('#csvErrors');
    if(box) box.innerHTML = `<div class="warn ${errors.length?'':'info'}"><b>Import Summary</b>${valid.length} row(s) imported successfully. ${errors.length} row(s) had errors.</div>` +
      (errors.length? `<div class="warn-list" style="margin-top:6px;">${errors.map(er=>`<div class="warn">${esc(er)}</div>`).join('')}</div>`:'');
    renderSection();
    toast(`${valid.length} load(s) imported`);
  };
  reader.readAsText(f);
  e.target.value='';
}

          <div class="field"><label>Temperature derating (%)</label><input type="number" id="b_derate" value="${p.battery.tempDerate}"></div>

${fmtNum(R.battSel.avgBackupPowerKw,2)} kW × ${R.battSel.backupHours} h = ${fmtNum(R.battSel.requiredUsableKwh,2)} kWh usable

Usable ÷ (DoD × Round-trip eff. × Temp derating) × margin = Required nominal capacity
${fmtNum(R.battSel.requiredUsableKwh,2)} ÷ (${p.battery.dod}% × ${p.battery.roundTrip}% × ${100-p.battery.tempDerate}%) × 1.1 = ${fmtNum(R.battSel.requiredNominalKwh,2)} kWh</div>

          <div class="field" style="margin-top:10px;"><label>Manual override — battery quantity</label>
            <input type="number" id="b_qty" placeholder="auto" value="${p.batteryQtyOverride!=null?p.batteryQtyOverride:''}"></div>
          <div class="divider"></div>
          <h4>Price for this project</h4>
          <div id="battPriceBox">${priceOptionsHTML(p, eq.category, eq)}</div>
          ${R.battSel.warnings.length? `<div class="warn-list" style="margin-top:10px;">${R.battSel.warnings.map(w=>`<div class="warn"><b>Warning</b>${esc(w)}</div>`).join('')}</div>`:''}

  bindNum('#b_rte', v=>p.battery.roundTrip=v);
  bindNum('#b_reserve', v=>p.battery.reserveSOC=v);

  const bq = $('#b_qty'); if(bq) bq.addEventListener('change', e=>{ p.batteryQtyOverride = e.target.value===''?null:num(e.target.value); persistCurrent(); recompute(); renderSection(); });
  if(eq) bindPriceOptions($('#battPriceBox'), p, eq.category, ()=>renderSection());
}

/* =========================================================
   ELECTRICAL DESIGN (cables, protection, transformer, architecture, generator)
   ========================================================= */
function architectureText(p, R){
  const lines = ['Solar PV'];
  if(R.stringD) lines.push('  \u2193 DC Protection / Combiner');
  lines.push('  \u2193');
  lines.push(R.invSel.equip ? `${p.inverterCfg.type} Inverter (${esc(R.invSel.equip.name)})` : 'Inverter (not yet selected)');
  if(R.battSel.equip){ lines.push('  \u2194'); lines.push(`Battery Energy Storage — ${esc(R.battSel.equip.name)}`); }
  lines.push('  \u2193');
  lines.push('AC Distribution');
  if(p.generator.enabled) lines.push('  \u2194 Generator ('+p.generator.capacity+' kVA)');
  if(p.elec.gridAvail!=='No') lines.push('  \u2194 Utility Grid');
  lines.push('  \u2193');
  lines.push('Critical / Essential / Non-critical Loads');
  return lines.join('\n');
}

function openEquipEditor(existing){
  const eq = existing ? clone(existing) : { id: uid('eq'), category:'Solar Panel', manufacturer:'', model:'', name:'', supplier:'Tiger Empire', unit:'pc', prices:[{label:'Standard Price', amount:0, currency:'NGN', source:'Manual Entry'}] };
  const overlay = el(`<div class="modal-overlay"></div>`);
  overlay.innerHTML = `<div class="modal">
    <span class="close-x">&times;</span>
    <h3>${existing?'Edit':'Add'} Product</h3>
    <div class="grid g2">
      <div class="field"><label>Category</label><select id="eq_cat">${EQUIP_CATEGORIES.map(c=>`<option ${eq.category===c?'selected':''}>${c}</option>`).join('')}</select></div>
      <div class="field"><label>Manufacturer</label><input id="eq_mfr" value="${esc(eq.manufacturer)}"></div>
      <div class="field"><label>Model / SKU</label><input id="eq_model" value="${esc(eq.model||'')}"></div>
      <div class="field"><label>Supplier</label><input id="eq_supplier" value="${esc(eq.supplier)}"></div>
    </div>
    <div class="field"><label>Product name / specification</label><input id="eq_name" value="${esc(eq.name)}"></div>
    <div class="field"><label>Unit price (NGN)</label><input type="number" id="eq_price" value="${eq.prices[0]?eq.prices[0].amount:0}"></div>
    <div class="hint">Additional named prices (e.g. multiple supplier quotes) can be added after saving by editing again — this quick form sets the primary price.</div>
    <div class="chip-row" style="margin-top:14px;"><button class="btn primary" id="eq_save">Save Product</button><button class="btn" id="eq_cancel">Cancel</button></div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('.close-x').addEventListener('click', ()=>overlay.remove());
  overlay.querySelector('#eq_cancel').addEventListener('click', ()=>overlay.remove());
  overlay.querySelector('#eq_save').addEventListener('click', ()=>{
    const g = id=>overlay.querySelector(id);
    const price = num(g('#eq_price').value);
    if(price<0){ alert('Price cannot be negative.'); return; }
    const rec = {
      id: eq.id, category: g('#eq_cat').value, manufacturer: g('#eq_mfr').value||'Unspecified',
      model: g('#eq_model').value, name: g('#eq_name').value||'Unnamed product', supplier: g('#eq_supplier').value||'Custom',
      unit:'pc', prices:[{label:'Standard Price', amount:price, currency:'NGN', source:'Manual Entry'}]
    };
    const idxCustom = CUSTOM_EQUIP.findIndex(c=>c.id===eq.id);
    const isMaster = MASTER_INVENTORY.some(m=>m.id===eq.id);
    if(isMaster){
      // editing a master item: mark master deleted, add edited copy as custom with same id-ish
      if(!DELETED_MASTER.includes(eq.id)){ DELETED_MASTER.push(eq.id); saveDeleted(); }
      CUSTOM_EQUIP.push(rec);
    } else if(idxCustom>=0){ CUSTOM_EQUIP[idxCustom]=rec; }
    else { CUSTOM_EQUIP.push(rec); }
    saveEquip();
    overlay.remove(); renderSection(); toast('Product saved');
  });
}

function handleInventoryCsv(e){
  const f = e.target.files[0]; if(!f) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    const {rows} = parseCSV(reader.result);
    let imported=0, review=0, invalid=0;
    const map=(row,keys)=>{for(const k of keys){if(row[k]!==undefined) return row[k];} return undefined;};
    rows.forEach(row=>{
      const name = map(row,['Name','Product','name']);
      const priceRaw = map(row,['Amount','Price','Unit Price','price']);
      const price = priceRaw!==undefined? num(priceRaw) : null;
      if(!name){ invalid++; return; }
      if(priceRaw!==undefined && isNaN(num(priceRaw))){ review++; }
      CUSTOM_EQUIP.push({
        id: uid('eq'), category: map(row,['Category','category'])||'Other',
        manufacturer: map(row,['Manufacturer','manufacturer'])||'Unspecified',
        model: map(row,['Model','model'])||'', name,
        supplier: map(row,['Supplier','supplier'])||'Imported', unit:'pc',
        prices:[{label: map(row,['Price Label'])||'Imported Price', amount: price, currency:'NGN', source:'CSV Import'}]
      });
      imported++;
    });
    saveEquip();
    $('#invImportSummary').innerHTML = `<div class="warn info"><b>Import Summary</b>${imported} record(s) imported · ${review} flagged for review (missing/invalid price) · ${invalid} invalid record(s) skipped (no product name).</div>`;
    renderSection();
    toast(`${imported} product(s) imported`);
  };
  reader.readAsText(f);
  e.target.value='';
}

function boqLines(p, R){
  const lines = [];
  let n=1;
  if(R.panelSel.equip) lines.push({no:n++, category:'Solar Panel', equipment:R.panelSel.equip.name, manufacturer:R.panelSel.equip.manufacturer, model:R.panelSel.equip.model||'', qty:R.panelSel.qty, unit:'pc', unitPrice:R.panelSel.unitPrice, total:R.panelSel.totalCost, supplier:R.panelSel.equip.supplier});
  if(R.invSel.equip) lines.push({no:n++, category:'Inverter', equipment:R.invSel.equip.name, manufacturer:R.invSel.equip.manufacturer, model:R.invSel.equip.model||'', qty:R.invSel.qty, unit:'pc', unitPrice:R.invSel.unitPrice, total:R.invSel.totalCost, supplier:R.invSel.equip.supplier});
  if(R.battSel.equip) lines.push({no:n++, category:'Battery', equipment:R.battSel.equip.name, manufacturer:R.battSel.equip.manufacturer, model:R.battSel.equip.model||'', qty:R.battSel.qty, unit:'pc', unitPrice:R.battSel.unitPrice, total:R.battSel.totalCost, supplier:R.battSel.equip.supplier});
  p.boqExtra.forEach(x=>lines.push({no:n++, category:x.category, equipment:x.equipment, manufacturer:x.manufacturer||'', model:x.model||'', qty:x.qty, unit:x.unit||'pc', unitPrice:x.unitPrice, total:(x.unitPrice||0)*x.qty, supplier:x.supplier||'', extraId:x.id}));
  return lines;
}

function sensitivityRows(p, R){
  function payback(tariffMult, costMult){
    const savings = R.roi.baseSavings*tariffMult;
    const invest = R.roi.invest*costMult;
    return savings>0? invest/savings : null;
  }
  const rows = [
    ['Electricity tariff', payback(0.8,1), payback(1,1), payback(1.2,1)],
    ['System cost', payback(1,0.8), payback(1,1), payback(1,1.2)],
  ];
  return rows.map(r=>`<tr><td>${r[0]}</td><td class="num">${r[1]?fmtNum(r[1],1)+'y':'—'}</td><td class="num">${r[2]?fmtNum(r[2],1)+'y':'—'}</td><td class="num">${r[3]?fmtNum(r[3],1)+'y':'—'}</td></tr>`).join('');
}

    <tbody>${p.costItems.map(x=>`<tr><td>${esc(x.category)}</td><td>${esc(x.description)}</td><td class="num">${x.qty} ${esc(x.unit)}</td><td class="num">${fmtMoney(x.unitPrice,p.currency)}</td><td class="num">${fmtMoney(num(x.qty)*num(x.unitPrice),p.currency)}</td></tr>`).join('')||'<tr><td colspan="5">No items</td></tr>'}</tbody></table>

    <h3 style="margin-top:16px;">11. Financial Analysis</h3>
    <table class="data"><tbody>
      <tr><td>Equipment subtotal</td><td class="num">${fmtMoney(R.financial.equipmentSubtotal,p.currency)}</td></tr>
      <tr><td>Installation + Engineering + Other</td><td class="num">${fmtMoney(R.financial.installationSubtotal+R.financial.engineeringSubtotal+R.financial.otherCosts,p.currency)}</td></tr>
      <tr><td>Contingency & taxes</td><td class="num">${fmtMoney(R.financial.contingency+R.financial.taxes,p.currency)}</td></tr>
      <tr style="font-weight:700;"><td>Total Project Cost</td><td class="num">${fmtMoney(R.financial.grandTotal,p.currency)}</td></tr>
    </tbody></table>

    <h3 style="margin-top:16px;">12. ROI, Payback, NPV, IRR</h3>
    <table class="data"><tbody>
      <tr><td>Simple payback</td><td class="num">${R.roi.simplePayback?fmtNum(R.roi.simplePayback,1)+' years':'n/a'}</td></tr>
      <tr><td>ROI (lifetime)</td><td class="num">${fmtNum(R.roi.roiPct,1)}%</td></tr>

    </tbody></table>

    <h3 style="margin-top:16px;">13. Environmental Benefits</h3>
    <p>Estimated ${fmtNum(R.carbon.annualCO2,2)} tonnes of CO\u2082 avoided annually (${fmtNum(R.carbon.lifetimeCO2,1)} tonnes over ${p.roi.lifetime} years), assuming a grid emission factor of ${p.carbon.emissionFactor} kg CO\u2082/kWh — an assumption entered by the engineer.</p>

    <h3>14. Design Assumptions</h3>
    <table class="data"><tbody>
      <tr><td>Peak Sun Hours</td><td>${fmtNum(p.solar.psh,2)} h/day</td></tr>
      <tr><td>System efficiency</td><td>${fmtNum(R.pv.efficiency*100,1)}%</td></tr>
      <tr><td>Battery DoD</td><td>${p.battery.dod}%</td></tr>
      <tr><td>Battery round-trip efficiency</td><td>${p.battery.roundTrip}%</td></tr>
      <tr><td>Design margin</td><td>${p.solar.designMargin}%</td></tr>
      <tr><td>Electricity tariff</td><td>${fmtMoney(p.tariff,p.currency)}/kWh</td></tr>
      <tr><td>Tariff escalation</td><td>${p.roi.tariffEscalation}%/yr</td></tr>
      <tr><td>System degradation</td><td>${p.roi.degradation}%/yr</td></tr>
      <tr><td>Project lifetime</td><td>${p.roi.lifetime} years</td></tr>
      <tr><td>Discount rate</td><td>${p.roi.interestRate}%</td></tr>
      <tr><td>Carbon emission factor</td><td>${p.carbon.emissionFactor} kg CO\u2082/kWh</td></tr>
      <tr><td>Cable voltage-drop limit</td><td>${p.cable.maxVdrop}%</td></tr>
      <tr><td>Cable run lengths (PV / DC / AC)</td><td>${p.cable.pvLength}m / ${p.cable.dcLength}m / ${p.cable.acLength}m</td></tr>
      <tr><td>Strings per combiner box input</td><td>${p.cable.combinerCapacity}</td></tr>
    </tbody></table>

    <h3 style="margin-top:16px;">15. Engineering Warnings</h3>
    ${warningsPanel(R.warnings)}

    <h3 style="margin-top:16px;">16. Warranty / Maintenance Assumptions</h3>
    <p>Warranty terms follow the selected equipment manufacturers as listed in the equipment database. Routine maintenance (panel cleaning, connection checks, battery SOC monitoring) is assumed and budgeted at ${p.roi.annualMaintenancePct}% of capital cost annually.</p>

    <h3 style="margin-top:16px;">17. Conclusion</h3>
    <p>The proposed system meets the identified load requirements with the design margins and assumptions stated above, subject to final engineering verification.</p>

    <div class="footer-disclaimer">${esc(DISCLAIMER_TEXT)}<br><br>Prepared by ${esc(co.name)} — ${esc(co.phone)} — ${esc(co.email)}${co.reg?' — '+esc(co.reg):''}<br>Report generated ${new Date().toLocaleString()}</div>
  </div>`;
}

function printReport(){
  const p = getCurrent(); if(!p) return;
  $all('.section').forEach(s=>s.classList.remove('print-active'));
  let printSec = $('#sec-reports');
  if(!printSec){
    // build a temporary offscreen container reusing report HTML
    navigate('reports');
    printSec = $('#sec-reports');
  }
  printSec.classList.add('print-active');
  setTimeout(()=>{ window.print(); }, 50);
}
function generatePDF(){
  toast('Opening print dialog — choose “Save as PDF”');
  printReport();
}
window.addEventListener('afterprint', ()=>{ $all('.section').forEach(s=>s.classList.remove('print-active')); if(ACTIVE_SECTION) $('#sec-'+ACTIVE_SECTION) && $('#sec-'+ACTIVE_SECTION).classList.add('active'); });

/* =========================================================
   SHARE BACKUP — lightweight "sync" via the device's native
   share sheet (Gmail, Drive, WhatsApp, etc.), no account linking.
   ========================================================= */
function backupPayload(){
  return JSON.stringify({ projects:PROJECTS, customEquipment:CUSTOM_EQUIP, deletedMaster:DELETED_MASTER, company:COMPANY, exportedAt:nowISO() }, null, 2);
}
async function shareBackup(){
  const payload = backupPayload();
  const filename = 'tiger_empire_app_data_backup.json';
  let shared = false;
  try{
    if(navigator.canShare && navigator.share){
      const file = new File([payload], filename, {type:'application/json'});
      if(navigator.canShare({files:[file]})){
        await navigator.share({ files:[file], title:'Tiger Empire Solar Designer Backup', text:'App data backup — '+new Date().toLocaleString() });
        shared = true;
      }
    }
  }catch(err){
    if(err && err.name==='AbortError'){ return false; } // user cancelled — not a failure
    console.warn('Share failed, falling back to download:', err);
  }
  if(!shared){
    downloadFile(filename, payload, 'application/json');
    toast('Backup downloaded — attach it to an email or upload it to Drive manually');
  } else {
    toast('Backup shared');
  }
  localStorage.setItem(LS_LASTBACKUP, String(Date.now()));
  return true;
}

function showBackupBanner(){
  if(document.getElementById('backupBanner')) return;
  const main = $('#main'); if(!main) return;
  const bar = el(`<div id="backupBanner" class="no-print" style="background:var(--gold);color:var(--ink);padding:9px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12.5px;flex-wrap:wrap;">
    <span>You're back online — want to back up your data?</span>
    <span class="chip-row">
      <button class="btn sm" id="bkShareBtn" style="background:var(--ink);color:#fff;border-color:var(--ink);">Share Backup</button>
      <button class="btn sm" id="bkDismissBtn" style="background:transparent;border-color:var(--ink);color:var(--ink);">Not now</button>
    </span>
  </div>`);
  main.insertBefore(bar, main.firstChild);
  $('#bkShareBtn', bar).addEventListener('click', async ()=>{ await shareBackup(); bar.remove(); });
  $('#bkDismissBtn', bar).addEventListener('click', ()=>{ localStorage.setItem(LS_LASTBACKUP, String(Date.now())); bar.remove(); });
}
function maybeShowBackupBanner(){
  if(!navigator.onLine) return;
  if(Object.keys(PROJECTS).length===0) return;
  const last = parseInt(localStorage.getItem(LS_LASTBACKUP)||'0', 10);
  const sixHours = 6*60*60*1000;
  if(Date.now()-last < sixHours) return;
  showBackupBanner();
}
window.addEventListener('online', maybeShowBackupBanner);

/* =========================================================
   SETTINGS — Company Profile
   ========================================================= */
function renderSettings(p, root){
  root.innerHTML = `
    <div class="pagehead"><div><h2>Settings</h2><div class="sub">Company profile used across all project reports</div></div></div>
    <div class="two-col">
      <div class="card">
        <h3>Company Profile</h3>
        <div class="field">
          <label>Company logo</label>
          <div style="display:flex;align-items:center;gap:14px;">
            <div id="logoPreviewBox" style="width:72px;height:72px;border-radius:var(--radius);background:var(--ink);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:0 0 72px;border:1px solid var(--line);">
              ${COMPANY.logo? `<img src="${COMPANY.logo}" style="width:100%;height:100%;object-fit:cover;">` : `<span class="small-note" style="color:#8CA2C9;">No logo</span>`}
            </div>
            <div class="chip-row">
              <button class="btn sm" id="btnUploadLogo">${COMPANY.logo?'Change Logo':'Upload Logo'}</button>
              ${COMPANY.logo? `<button class="btn sm danger" id="btnRemoveLogo">Remove</button>` : ''}
              <input type="file" id="logoFileInput" accept="image/*" style="display:none;">
            </div>
          </div>
          <div class="hint">Used in the sidebar and on the PDF proposal letterhead. Square images work best (PNG or JPG, ideally 300&times;300px or larger).</div>
        </div>
        <div class="grid g2">
          <div class="field"><label>Company name</label><input id="co_name" value="${esc(COMPANY.name)}"></div>
          <div class="field"><label>Engineer name</label><input id="co_engineer" value="${esc(COMPANY.engineer)}"></div>
          <div class="field"><label>Phone</label><input id="co_phone" value="${esc(COMPANY.phone)}"></div>
          <div class="field"><label>Email</label><input id="co_email" value="${esc(COMPANY.email)}"></div>
          <div class="field"><label>Website</label><input id="co_website" value="${esc(COMPANY.website)}"></div>
          <div class="field"><label>Registration / License</label><input id="co_reg" value="${esc(COMPANY.reg)}"></div>
          <div class="field"><label>Default currency</label><select id="co_currency">${CURRENCIES.map(c=>`<option ${COMPANY.defaultCurrency===c?'selected':''}>${c}</option>`).join('')}</select></div>
          <div class="field"><label>Default PSH assumption</label><input type="number" step="0.1" id="co_psh" value="${COMPANY.defaultPSH}"></div>
          <div class="field"><label>Default design margin (%)</label><input type="number" id="co_margin" value="${COMPANY.defaultMargin}"></div>
        </div>
        <div class="field"><label>Address</label><input id="co_address" value="${esc(COMPANY.address)}"></div>
        <div class="field"><label>Company description</label><textarea id="co_desc" rows="2">${esc(COMPANY.description)}</textarea></div>
        <button class="btn primary sm" id="co_save">Save Company Profile</button>
      </div>
      <div class="card">
        <h3>Application Data</h3>
        <div class="chip-row" style="margin-bottom:12px;">
          <button class="btn sm" id="btnExportAll">Export All Data (JSON)</button>
          <button class="btn sm" id="btnShareBackupNow">Share Backup</button>
          <button class="btn sm" id="btnImportAll">Import All Data</button>
          <input type="file" id="fileImportAll" accept=".json" style="display:none;">
        </div>
        <div class="hint" style="margin-bottom:6px;">"Share Backup" opens your phone's share sheet so you can send a backup straight to Gmail, Google Drive, WhatsApp, or anywhere else — no account linking required.</div>
        <div class="divider"></div>
        <h4>Reset Application</h4>
        <p class="small-note">This clears all projects, custom equipment, and settings stored in this browser. This cannot be undone.</p>
        <button class="btn danger sm" id="btnClearAll">Clear All Stored Data</button>
        <div class="divider"></div>
        <h4>Storage Used</h4>
        <div class="mono small-note" id="storageInfo"></div>
      </div>
    </div>
  `;
  $('#co_save').addEventListener('click', ()=>{
    COMPANY.name=$('#co_name').value; COMPANY.engineer=$('#co_engineer').value; COMPANY.phone=$('#co_phone').value;
    COMPANY.email=$('#co_email').value; COMPANY.website=$('#co_website').value; COMPANY.reg=$('#co_reg').value;
    COMPANY.defaultCurrency=$('#co_currency').value; COMPANY.defaultPSH=num($('#co_psh').value); COMPANY.defaultMargin=num($('#co_margin').value);
    COMPANY.address=$('#co_address').value; COMPANY.description=$('#co_desc').value;
    saveCompany(); toast('Company profile saved');
  });
  $('#btnUploadLogo').addEventListener('click', ()=>$('#logoFileInput').click());
  $('#logoFileInput').addEventListener('change', e=>{
    const file = e.target.files[0]; if(!file) return;
    if(!file.type.startsWith('image/')){ alert('Please choose an image file.'); return; }
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        // Resize/compress client-side so the logo stays small in storage regardless of the source photo size.
        const MAX = 400;
        let w = img.width, h = img.height;
        if(w>h && w>MAX){ h = Math.round(h*MAX/w); w = MAX; }
        else if(h>=w && h>MAX){ w = Math.round(w*MAX/h); h = MAX; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        COMPANY.logo = canvas.toDataURL('image/png');
        saveCompany();
        renderSection();
        refreshBrand();
        toast('Logo updated');
      };
      img.onerror = () => alert('Could not read that image — try a different file.');
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
  const removeBtn = $('#btnRemoveLogo');
  if(removeBtn) removeBtn.addEventListener('click', ()=>{
    if(!confirm('Remove the company logo?')) return;
    COMPANY.logo = '';
    saveCompany();
    renderSection();
    refreshBrand();
    toast('Logo removed');
  });
  $('#btnExportAll').addEventListener('click', ()=>{
    const all = {projects:PROJECTS, customEquipment:CUSTOM_EQUIP, deletedMaster:DELETED_MASTER, company:COMPANY, exportedAt:nowISO()};
    downloadFile('tiger_empire_app_data_backup.json', JSON.stringify(all,null,2), 'application/json');
  });
  $('#btnShareBackupNow').addEventListener('click', ()=>shareBackup());
  $('#btnImportAll').addEventListener('click', ()=>$('#fileImportAll').click());
  $('#fileImportAll').addEventListener('change', e=>{
    const f = e.target.files[0]; if(!f) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const obj = JSON.parse(reader.result);
        if(obj.projects) PROJECTS = obj.projects;
        if(obj.customEquipment) CUSTOM_EQUIP = obj.customEquipment;
        if(obj.deletedMaster) DELETED_MASTER = obj.deletedMaster;
        if(obj.company) COMPANY = obj.company;
        saveProjects(); saveEquip(); saveDeleted(); saveCompany();
        const ids = Object.keys(PROJECTS); if(ids.length) setCurrent(ids[0]);
        recompute(); renderSection();
        toast('Data imported successfully');
      }catch(err){ alert('Invalid backup file: '+err.message); }
    };
    reader.readAsText(f);
  });
  $('#btnClearAll').addEventListener('click', ()=>{
    if(!confirm('This will permanently delete ALL projects and settings in this browser. Continue?')) return;
    if(!confirm('Are you absolutely sure? This cannot be undone.')) return;
    localStorage.removeItem(LS_PROJECTS); localStorage.removeItem(LS_CURRENT); localStorage.removeItem(LS_EQUIP);
    localStorage.removeItem(LS_COMPANY); localStorage.removeItem(LS_DELETED);
    location.reload();
  });
  try{
    let bytes=0; for(const k in localStorage){ if(localStorage.hasOwnProperty(k)) bytes += (localStorage[k]||'').length; }
    $('#storageInfo').textContent = `~${(bytes/1024).toFixed(1)} KB used in localStorage · ${Object.keys(PROJECTS).length} project(s) · ${getInventory().length} equipment records`;
  }catch(e){}
}

  ensureProject();

  recompute();
  renderShellHeader();

}

  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(err=>console.warn('SW registration failed:', err));
